server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

spring:
  application:
    name: clinic-app
  datasource:
    clinic:
      jdbc-url: jdbc:h2:mem:testdb
      username: sa
      password: 
      driver-class-name: org.h2.Driver
      hikari:
        connection-timeout: 10000
        maximum-pool-size: 5
        minimum-idle: 2
        initialization-fail-timeout: 1
    pharmacy:
      jdbc-url: jdbc:h2:mem:pharmacydb
      username: sa
      password: 
      driver-class-name: org.h2.Driver
      hikari:
        connection-timeout: 10000
        maximum-pool-size: 5
        minimum-idle: 2
        initialization-fail-timeout: 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: mock-secret-key-that-is-at-least-32-chars-long-for-testing
  access-token-expiration-ms: 3600000

cors:
  # In production (Render), override via the ALLOWED_ORIGINS environment variable.
  # Set it to your Render frontend URL, e.g.: https://your-app.onrender.com
  # For multiple origins: https://your-app.onrender.com,http://localhost:5173
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info

twilio:
  account-sid: dummy
  auth-token: dummy
  from-number: dummy

stripe:
  secret-key: dummy
  webhook-secret: dummy
  publishable-key: dummy

  flyway:
    enabled: false
