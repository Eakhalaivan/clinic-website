server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

spring:
  application:
    name: clinic-app
  datasource:
    clinic:
      jdbc-url: ${DB_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        connection-timeout: 10000
        maximum-pool-size: 5
        minimum-idle: 2
        initialization-fail-timeout: 1
    pharmacy:
      jdbc-url: ${PHARMACY_DB_URL}
      username: ${PHARMACY_DB_USER}
      password: ${PHARMACY_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        connection-timeout: 10000
        maximum-pool-size: 5
        minimum-idle: 2
        initialization-fail-timeout: 1
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET environment variable must be set}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes (dev default; override via JWT_EXPIRATION_MS env var in production)

cors:
  # In production (Render), override via the ALLOWED_ORIGINS environment variable.
  # Set it to your Render frontend URL, e.g.: https://your-app.onrender.com
  # For multiple origins: https://your-app.onrender.com,http://localhost:5173
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  from-number: ${TWILIO_FROM_NUMBER}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
