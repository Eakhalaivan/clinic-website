server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

spring:
  application:
    name: clinic-app
  datasource:
    clinic:
      jdbc-url: ${DB_URL:jdbc:postgresql://pg-2ec02a9b-eakhalaivanp-46d0.i.aivencloud.com:15783/defaultdb?sslmode=require}
      username: ${DB_USER:avnadmin}
      password: ${DB_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        connection-timeout: 10000
        maximum-pool-size: 5
        minimum-idle: 2
        initialization-fail-timeout: 1
    pharmacy:
      jdbc-url: ${PHARMACY_DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/pms?useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3&sslMode=REQUIRED}
      username: ${PHARMACY_DB_USER:3ZMzEHamXVuJdSt.root}
      password: ${PHARMACY_DB_PASSWORD:o2ldKmVs3hjxipyi}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        connection-timeout: 10000
        maximum-pool-size: 5
        minimum-idle: 2
        initialization-fail-timeout: 1
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET environment variable must be set}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes (dev default; override via JWT_EXPIRATION_MS env var in production)

cors:
  # In production (Render), override via the ALLOWED_ORIGINS environment variable.
  # Set it to your Render frontend URL, e.g.: https://your-app.onrender.com
  # For multiple origins: https://your-app.onrender.com,http://localhost:5173
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:dummy}
  auth-token: ${TWILIO_AUTH_TOKEN:dummy}
  from-number: ${TWILIO_FROM_NUMBER:dummy}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:dummy_secret_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:dummy_webhook_secret}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:dummy_publishable_key}
