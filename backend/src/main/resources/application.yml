server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: clinic-app
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:default_secret_key_that_is_long_enough_for_hs256_algorithm_12345}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes

cors:
  # In production (Render), override via the ALLOWED_ORIGINS environment variable.
  # Set it to your Render frontend URL, e.g.: https://your-app.onrender.com
  # For multiple origins: https://your-app.onrender.com,http://localhost:5173
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  from-number: ${TWILIO_FROM_NUMBER}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
