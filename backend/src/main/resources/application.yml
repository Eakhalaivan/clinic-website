server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE

spring:
  application:
    name: clinic-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://pg-2ec02a9b-eakhalaivanp-46d0.i.aivencloud.com:15783/defaultdb?sslmode=require}
    username: ${DB_USER:avnadmin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
      minimum-idle: 2
      initialization-fail-timeout: 1
      data-source-properties:
        sslmode: require
        ssl: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET environment variable must be set}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes (dev default; override via JWT_EXPIRATION_MS env var in production)

cors:
  # In production (Render), override via the ALLOWED_ORIGINS environment variable.
  # Set it to your Render frontend URL, e.g.: https://your-app.onrender.com
  # For multiple origins: https://your-app.onrender.com,http://localhost:5173
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:dummy}
  auth-token: ${TWILIO_AUTH_TOKEN:dummy}
  from-number: ${TWILIO_FROM_NUMBER:dummy}
