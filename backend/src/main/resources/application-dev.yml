spring:
  datasource:
    clinic:
      jdbc-url: jdbc:h2:mem:clinicdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      driver-class-name: org.h2.Driver
      username: sa
      password: password
    pharmacy:
      jdbc-url: jdbc:h2:mem:pharmacydb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

jwt:
  secret: default_dev_secret_key_that_is_long_enough_for_hs256_algorithm_12345
  access-token-expiration-ms: 86400000

stripe:
  secret-key: dummy_stripe_key
  webhook-secret: dummy_webhook_secret
  publishable-key: dummy_publishable_key

twilio:
  account-sid: dummy_twilio_sid
  auth-token: dummy_twilio_token
  from-number: dummy_twilio_number
